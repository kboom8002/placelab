name: "Supabase Edge Functions — Lint"

on:
  push:
    paths:
      - 'supabase/functions/**'
  pull_request:
    paths:
      - 'supabase/functions/**'

jobs:
  deno-check:
    name: Deno Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Type check Edge Functions
        run: |
          for dir in supabase/functions/*/; do
            if [ -f "$dir/index.ts" ]; then
              echo "Checking $dir..."
              deno check --no-lock "$dir/index.ts" || true
            fi
          done

      - name: Verify auth guard is imported
        run: |
          for dir in supabase/functions/scan-enqueue supabase/functions/scan-worker supabase/functions/verdict-promote; do
            if [ -f "$dir/index.ts" ]; then
              if ! grep -q "requireAuth\|auth" "$dir/index.ts"; then
                echo "::warning::$dir/index.ts에 인증 가드가 없습니다 (M-08)"
              fi
            fi
          done
