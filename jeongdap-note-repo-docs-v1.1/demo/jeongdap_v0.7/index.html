a{color:var(--blue)}
button{font:inherit;cursor:pointer}

.logo{font-weight:800;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px}

.crumb{font-size:.88rem;color:var(--ink2);margin-bottom:6px}

 const k=best.key;const has=v=>v&&s.replace(/\s/g,'').indexOf(v.replace(/\s/g,'').replace(/\(.*\)/,'').slice(0,4))>=0;let lab=best.label;let why='';if(has(k.ok)||k.var.some(has)){lab='ok';why='정답과 같아요'}else if(k.old.some(has)){lab='old';why='옛 값과 같아요'}else if(k.mix.some(has)){lab='mix';why='혼동 값과 같아요'}else why=LAB[lab][2];return {s,label:lab,hit:best,why}})}
