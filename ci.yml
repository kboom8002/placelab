name: CI — Build & Invariant Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm tsc --noEmit

      - name: ESLint
        run: pnpm lint

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1

  invariant-tests:
    name: "🛡️ Invariant Tests (INV-1 ~ INV-12)"
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run invariant tests
        run: pnpm test:invariants

  self-compliance:
    name: "🤖 Self-Compliance Check (AGENTS.md §7)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: robots.txt exists and is open
        run: |
          if [ ! -f "public/robots.txt" ] && ! grep -q "robots" "app/robots.ts" 2>/dev/null; then
            echo "::error::robots.txt 또는 app/robots.ts가 없습니다 (AGENTS.md §7)"
            exit 1
          fi

      - name: Sitemap declared
        run: |
          if [ ! -f "app/sitemap.ts" ] && [ ! -f "public/sitemap.xml" ]; then
            echo "::error::sitemap.ts 또는 sitemap.xml이 없습니다 (AGENTS.md §7)"
            exit 1
          fi

      - name: No forbidden phrases in public components
        run: |
          FORBIDDEN_PATTERNS="세계 최초|세계 유일|국내 유일|독보적|특허받은 방법론"
          if grep -rn "$FORBIDDEN_PATTERNS" app/ components/ --include="*.tsx" --include="*.ts" | grep -v "FORBIDDEN_WORDS" | grep -v "node_modules" | grep -v ".test."; then
            echo "::error::공개 컴포넌트에 금지 문구가 포함되어 있습니다 (AGENTS.md §4)"
            exit 1
          fi

  schema-validation:
    name: "🗄️ Schema Migration Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Migration files are sequential
        run: |
          ls supabase/migrations/*.sql | sort | head -20
          echo "✅ Migration files listed"

      - name: No UNION of populations in views
        run: |
          if grep -in "union.*select.*population" supabase/migrations/*.sql; then
            echo "::error::뷰 정의에 두 모집단을 UNION하는 쿼리가 있습니다 (INV-1)"
            exit 1
          fi
          echo "✅ No population UNION found"

      - name: audience_comparisons requires prereg_id NOT NULL
        run: |
          if grep -A5 "audience_comparisons" supabase/migrations/20260905000018_audience_tagging.sql | grep -q "prereg_id.*text.*not null"; then
            echo "✅ audience_comparisons.prereg_id is NOT NULL (INV-11)"
          else
            echo "::error::audience_comparisons.prereg_id가 NOT NULL이 아닙니다 (INV-11)"
            exit 1
          fi
